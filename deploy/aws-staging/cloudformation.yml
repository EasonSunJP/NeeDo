AWSTemplateFormatVersion: "2010-09-09"
Description: NeeDo Staging environment-only infrastructure in ap-northeast-1

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  AlertEmail:
    Type: String
    AllowedPattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
  BudgetAmount:
    Type: Number
    MinValue: 1
  BudgetUnit:
    Type: String
    AllowedPattern: "^[A-Z]{3}$"
  Owner:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,31}$"

Mappings:
  Network:
    Cidr:
      Vpc: 10.41.0.0/16
      PublicSubnet: 10.41.10.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [Network, Cidr, Vpc]
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Network, Cidr, PublicSubnet]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NeeDo Staging public HTTP and HTTPS only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Lets Encrypt HTTP-01 and redirect readiness
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Public HTTPS
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: AWS endpoints registries and approved HTTPS APIs
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 10.41.0.2/32
          Description: VPC DNS resolver UDP
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 10.41.0.2/32
          Description: VPC DNS resolver TCP
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  ReleaseBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  ReleaseBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReleaseBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ReleaseBucket.Arn
              - !Sub ${ReleaseBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DailyBackups30Days
            Status: Enabled
            Prefix: staging/daily/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: PreMigrationRecovery90Days
            Status: Enabled
            Prefix: staging/pre-migration/
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub ${BackupBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ApplicationSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: /needo/staging/application
      Description: Empty until the separately approved application deployment microstep
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  SystemLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /needo/staging/system
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  DockerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /needo/staging/docker
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: NeedoStagingRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOnlyApplicationSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApplicationSecret
              - Sid: ReadReleaseObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ReleaseBucket.Arn}/releases/*
              - Sid: ListReleasePrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ReleaseBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: releases/*
              - Sid: ReadWriteBackupPrefixes
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub ${BackupBucket.Arn}/staging/daily/*
                  - !Sub ${BackupBucket.Arn}/staging/pre-migration/*
              - Sid: ListBackupPrefixes
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - staging/daily/*
                      - staging/pre-migration/*
              - Sid: PublishHostMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Needo/Staging
              - Sid: ReadCloudWatchAgentConfig
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/needo/staging/cloudwatch-agent
              - Sid: WriteHostLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt SystemLogGroup.Arn
                  - !GetAtt DockerLogGroup.Arn
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t4g.large
      IamInstanceProfile:
        Name: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Monitoring: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 30
            VolumeType: gp3
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt PublicSubnet.AvailabilityZone
      Encrypted: true
      Size: 70
      VolumeType: gp3
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref AlertEmail
      Protocol: email
      TopicArn: !Ref AlertTopic

  CloudWatchAgentConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /needo/staging/cloudwatch-agent
      Type: String
      Description: NeeDo Staging host metrics and logs configuration
      Value: |
        {
          "agent": {
            "metrics_collection_interval": 60
          },
          "metrics": {
            "namespace": "Needo/Staging",
            "append_dimensions": {
              "InstanceId": "${aws:InstanceId}"
            },
            "metrics_collected": {
              "mem": {
                "measurement": ["mem_used_percent"],
                "metrics_collection_interval": 60
              },
              "swap": {
                "measurement": ["swap_used_percent"],
                "metrics_collection_interval": 60
              },
              "disk": {
                "measurement": ["disk_used_percent"],
                "metrics_collection_interval": 60,
                "resources": ["/", "/srv/needo"],
                "drop_device": true
              }
            }
          },
          "logs": {
            "logs_collected": {
              "files": {
                "collect_list": [
                  {
                    "file_path": "/var/log/messages",
                    "log_group_name": "/needo/staging/system",
                    "log_stream_name": "{instance_id}"
                  },
                  {
                    "file_path": "/var/lib/docker/containers/*/*.log",
                    "log_group_name": "/needo/staging/docker",
                    "log_stream_name": "{instance_id}"
                  }
                ]
              }
            }
          }
        }
      Tags:
        Project: needo
        Environment: staging
        Owner: !Ref Owner
        ManagedBy: cloudformation

  StatusCheckFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Statistic: Maximum
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Period: 300
      TreatMissingData: missing
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  HighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: Needo/Staging
      MetricName: mem_used_percent
      Statistic: Average
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 85
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Period: 300
      TreatMissingData: breaching
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  RootDiskHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: Needo/Staging
      MetricName: disk_used_percent
      Statistic: Average
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 80
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Period: 300
      TreatMissingData: breaching
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
        - Name: path
          Value: /
        - Name: fstype
          Value: xfs
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  DataDiskHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: Needo/Staging
      MetricName: disk_used_percent
      Statistic: Average
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 80
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Period: 300
      TreatMissingData: breaching
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
        - Name: path
          Value: /srv/needo
        - Name: fstype
          Value: xfs
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetLimit:
          Amount: !Ref BudgetAmount
          Unit: !Ref BudgetUnit
        BudgetName: !Sub ${AWS::StackName}-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 75
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 90
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 90
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
      ResourceTags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  HostBootstrapDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentFormat: YAML
      DocumentType: Command
      Content:
        schemaVersion: "2.2"
        description: Prepare the NeeDo Staging host without deploying the application
        parameters:
          DataVolumeId:
            type: String
            description: Exact EBS data volume ID attached by this stack
            allowedPattern: "^vol-[0-9a-f]{8,17}$"
          CloudWatchAgentConfigParameter:
            type: String
            description: Exact SSM parameter containing the agent configuration
            default: /needo/staging/cloudwatch-agent
            allowedPattern: "^/needo/staging/cloudwatch-agent$"
        mainSteps:
          - action: aws:runShellScript
            name: PrepareEnvironmentHost
            inputs:
              timeoutSeconds: "900"
              runCommand:
                - |
                  set -euo pipefail

                  data_volume_id='{{ DataVolumeId }}'
                  target_serial="${data_volume_id//-/}"
                  cloudwatch_parameter='{{ CloudWatchAgentConfigParameter }}'
                  device=""

                  for _ in $(seq 1 60); do
                    for serial_file in /sys/block/nvme*n1/device/serial; do
                      test -e "$serial_file" || continue
                      serial="$(tr -d '[:space:]-' < "$serial_file")"
                      if test "$serial" = "$target_serial"; then
                        block_name="$(basename "$(dirname "$(dirname "$serial_file")")")"
                        device="/dev/$block_name"
                        break 2
                      fi
                    done
                    sleep 5
                  done

                  if test -z "$device" || test ! -b "$device"; then
                    echo "Expected data volume device did not appear within five minutes" >&2
                    exit 1
                  fi

                  command -v mkfs.xfs >/dev/null
                  command -v wipefs >/dev/null
                  existing_fs="$(lsblk -n -o FSTYPE "$device" | tr -d '[:space:]')"
                  if test -z "$existing_fs"; then
                    if wipefs -n "$device" | grep -q .; then
                      echo "Refusing to format a device with an existing signature" >&2
                      exit 1
                    fi
                    mkfs.xfs "$device"
                  elif test "$existing_fs" != "xfs"; then
                    echo "Existing data filesystem is not XFS" >&2
                    exit 1
                  fi

                  uuid="$(blkid -s UUID -o value "$device")"
                  test -n "$uuid"
                  mountpoint=/srv/needo
                  install -d -m 0750 "$mountpoint"

                  if grep -Eq '^[^#]+[[:space:]]+/srv/needo[[:space:]]+' /etc/fstab; then
                    grep -Eq "^UUID=$uuid[[:space:]]+/srv/needo[[:space:]]+xfs[[:space:]]" /etc/fstab || {
                      echo "Existing /srv/needo fstab entry does not match the data volume" >&2
                      exit 1
                    }
                  else
                    printf 'UUID=%s /srv/needo xfs defaults,nofail 0 2\n' "$uuid" >> /etc/fstab
                  fi

                  if findmnt --mountpoint "$mountpoint" >/dev/null; then
                    test "$(findmnt -n -o UUID --mountpoint "$mountpoint")" = "$uuid"
                  else
                    mount "$mountpoint"
                  fi

                  mountpoint=/srv/needo
                  findmnt --mountpoint "$mountpoint" >/dev/null
                  test "$(findmnt -n -o FSTYPE --mountpoint "$mountpoint")" = "xfs"
                  install -d -m 0750 \
                    "$mountpoint/mysql" \
                    "$mountpoint/redis" \
                    "$mountpoint/media/customer-avatars" \
                    "$mountpoint/media/identity-applications" \
                    "$mountpoint/media/im-media" \
                    "$mountpoint/media/content-media" \
                    "$mountpoint/releases"
                  test -d /srv/needo/media/customer-avatars

                  dnf install -y docker amazon-cloudwatch-agent
                  systemctl enable --now docker
                  /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                    -a fetch-config \
                    -m ec2 \
                    -s \
                    -c "ssm:$cloudwatch_parameter"
                  systemctl enable amazon-cloudwatch-agent
                  systemctl is-active --quiet docker
                  systemctl is-active --quiet amazon-cloudwatch-agent

                  install -d -m 0755 /var/lib/needo
                  install -m 0644 /dev/null /var/lib/needo/environment-bootstrap-v1
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

  HostVerificationDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentFormat: YAML
      DocumentType: Command
      Content:
        schemaVersion: "2.2"
        description: Verify the environment-only host without reading secrets or application data
        mainSteps:
          - action: aws:runShellScript
            name: VerifyEnvironmentHost
            inputs:
              runCommand:
                - |
                  set -euo pipefail
                  findmnt --mountpoint /srv/needo >/dev/null
                  test "$(findmnt -n -o FSTYPE --mountpoint /srv/needo)" = "xfs"
                  for path in mysql redis media/customer-avatars media/identity-applications media/im-media media/content-media releases; do
                    test -d "/srv/needo/$path"
                  done
                  systemctl is-active --quiet amazon-ssm-agent
                  systemctl is-active --quiet docker
                  systemctl is-active --quiet amazon-cloudwatch-agent
                  test -f /var/lib/needo/environment-bootstrap-v1
                  test -z "$(docker ps -q)"
                  test ! -e /srv/needo/releases/current
                  printf '{"mount":true,"filesystem":"xfs","directories":true,"services":true,"runningContainers":0,"activeRelease":false}\n'
      Tags:
        - Key: Project
          Value: needo
        - Key: Environment
          Value: staging
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  InstanceId:
    Value: !Ref Instance
  ElasticIp:
    Value: !Ref ElasticIp
  DataVolumeId:
    Value: !Ref DataVolume
  ReleaseBucketName:
    Value: !Ref ReleaseBucket
  BackupBucketName:
    Value: !Ref BackupBucket
  ApplicationSecretArn:
    Value: !Ref ApplicationSecret
  HostBootstrapDocumentName:
    Value: !Ref HostBootstrapDocument
  HostVerificationDocumentName:
    Value: !Ref HostVerificationDocument
  CloudWatchAgentConfigParameterName:
    Value: !Ref CloudWatchAgentConfigParameter
  BudgetName:
    Value: !Ref MonthlyBudget
