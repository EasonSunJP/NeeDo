upstream needo_backend {
  server backend:3000;
  keepalive 16;
}

upstream needo_ops_api {
  server ops-api:3000;
  keepalive 8;
}

upstream needo_merchant_api {
  server merchant-api:3000;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name staging.needo.life;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name staging.needo.life;
  root /usr/share/nginx/html;
  client_max_body_size 8m;

  ssl_certificate /etc/letsencrypt/live/staging.needo.life/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.needo.life/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /api/v1/metrics {
    deny all;
  }

  location /api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://needo_backend;
  }

  location /ops-api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://needo_ops_api/api/v1/;
  }

  location /merchant-api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://needo_merchant_api/api/v1/;
  }

  location /media/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://needo_backend;
  }

  location ~ ^/(?:merchant-admin|shop|admin|technician|NDA-admin|nda-admin|afirieito-admin|CPS-admin|cps-admin|business-admin|afirieito|cps|business|login)(?:/.*)?/assets/(.+)$ {
    try_files /assets/$1 =404;
  }

  location ~ ^/(?:merchant-admin|login/merchant-admin)(?:/.*)?$ {
    try_files $uri /store-admin.html;
  }

  location ~ ^/shop(?:/.*)?$ {
    try_files $uri /merchant.html;
  }

  location ~ ^/(?:NDA-admin|nda-admin|afirieito-admin|CPS-admin|cps-admin|business-admin|login/(?:NDA-admin|nda-admin|afirieito-admin|CPS-admin|cps-admin|business-admin))(?:/.*)?$ {
    try_files $uri /afirieito-admin.html;
  }

  location ~ ^/(?:afirieito|cps|business|login/(?:afirieito|cps|business))(?:/.*)?$ {
    try_files $uri /afirieito.html;
  }

  location ~ ^/(?:admin|login/admin)(?:/.*)?$ {
    try_files $uri /pf-admin.html;
  }

  location ~ ^/technician(?:/.*)?$ {
    try_files $uri /technician.html;
  }

  location / {
    try_files $uri $uri/ /user.html;
  }
}
